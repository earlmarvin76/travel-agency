<body>
    <header id="top">
        <a href="index.html"><h1 id="logo">Earl Marvin`s Travel Agency</h1></a>
        <button type="button" class="nav-toggle" aria-controls="site-menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav id="site-menu" aria-label="Primary navigation">

    <main>
        <section class="booking-section">
            <div class="section-heading"><p class="eyebrow">Stress-free travel</p><h2>Easy bookings</h2></div>
            <form class="booking-form" id="booking-form" action="mailto:earlmarvin76@gmail.com" method="post" enctype="text/plain">
                <div class="form-field"><label for="destination">Destination</label><select id="destination" name="destination" required><option>Bali</option><option>Paris</option><option>Tokyo</option><option>Dubai</option></select></div>
                <div class="form-field"><label for="travel-date">Travel date</label><input type="date" id="travel-date" name="travel-date" required></div>
                <div class="form-field"><label for="travelers">Travelers</label><input type="number" id="travelers" name="travelers" min="1" max="12" value="2"></div>
                <div class="form-field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="earlmatvin76@gmail.com" required></div>
                <button type="submit" class="button primary submit-button">Book now</button>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
